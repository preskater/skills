name: Link check

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    name: lychee
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          fail: true
          args: >-
            --no-progress
            --max-retries 2
            --accept 200,206,429
            --exclude-mail
            --exclude "img.shields.io"
            --exclude "github.com/preskater/skills/actions"
            "**/*.md"
