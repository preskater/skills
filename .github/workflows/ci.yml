name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: validate (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24", "26"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Validate skills and catalog
        run: node scripts/validate.mjs

  installer:
    name: installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check syntax
        run: bash -n scripts/install.sh
      - name: Install, bundle, and uninstall
        run: |
          set -euo pipefail
          export HOME="$(mktemp -d)"
          ./scripts/install.sh --dry-run
          ./scripts/install.sh
          test -L "$HOME/.agents/skills/preskater-plan"
          test -L "$HOME/.claude/skills/preskater-plan"
          ./scripts/install.sh --bundle reviewer
          test -L "$HOME/.agents/skills/preskater-review"
          ./scripts/install.sh --bundle delivery
          test -L "$HOME/.agents/skills/preskater-deploy"
          ./scripts/install.sh --uninstall
          test ! -e "$HOME/.agents/skills/preskater-review"
          test ! -e "$HOME/.claude/skills/preskater-plan"

  markdown:
    name: markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Lint Markdown
        env:
          npm_config_ignore_scripts: "true"
        run: npx --yes markdownlint-cli2@0.24.2

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint shell scripts
        run: |
          set -euo pipefail
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y shellcheck
          fi
          shellcheck scripts/*.sh
